name: Publish VsML Ontology

on:
  push:
    branches: [main]
    paths:
      - 'ontology/vsml.ttl'
      - 'docs/**'
      - 'instances/**'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out repo 
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Set up Python 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Install RDF tools
      - name: Install dependencies
        run: pip install rdflib

      # 4. Validate Turtle
      - name: Validate vsml.ttl
        run: |
          python3 - << 'EOF'
          from rdflib import Graph
          g = Graph()
          try:
              g.parse("ontology/vsml.ttl", format="turtle")
              print(f"✓ vsml.ttl valid — {len(g)} triples")
          except Exception as e:
              print(f"✗ Validation failed: {e}")
              exit(1)
          EOF

      # 5. Generate vsml.owl (RDF/XML)
      - name: Generate vsml.owl
        run: |
          python3 - << 'EOF'
          from rdflib import Graph
          g = Graph()
          g.parse("ontology/vsml.ttl", format="turtle")
          g.serialize("ontology/vsml.owl", format="xml")
          print(f"✓ vsml.owl generated — {len(g)} triples")
          EOF

      # 6. Generate vsml.jsonld
      - name: Generate vsml.jsonld
        run: |
          python3 - << 'EOF'
          from rdflib import Graph
          g = Graph()
          g.parse("ontology/vsml.ttl", format="turtle")
          g.serialize("ontology/vsml.jsonld", format="json-ld", indent=2)
          print(f"✓ vsml.jsonld generated — {len(g)} triples")
          EOF

      # 7. Generate docs/index.html from vsml.ttl 
      - name: Generate docs/index.html
        run: |
          python3 - << 'EOF'
          from rdflib import Graph, Namespace, RDF, RDFS, OWL
          from rdflib.namespace import SKOS, DCTERMS
          from datetime import date

          g = Graph()
          g.parse("ontology/vsml.ttl", format="turtle")

          VSML = Namespace("https://vsml.no/")

          def local(uri):
              return str(uri).split("/")[-1].split("#")[-1]

          # Collect classes
          classes = []
          for s in g.subjects(RDF.type, OWL.Class):
              label = g.value(s, RDFS.label) or local(s)
              defn  = g.value(s, SKOS.definition) or ""
              classes.append((f"vsml:{local(s)}", str(label), str(defn)))

          # Collect object properties
          properties = []
          for s in g.subjects(RDF.type, OWL.ObjectProperty):
              label = g.value(s, RDFS.label) or local(s)
              defn  = g.value(s, SKOS.definition) or ""
              properties.append((f"vsml:{local(s)}", str(label), str(defn)))

          # Collect named individuals
          individuals = []
          for s in g.subjects(RDF.type, OWL.NamedIndividual):
              label = g.value(s, RDFS.label) or local(s)
              defn  = g.value(s, SKOS.definition) or ""
              individuals.append((f"vsml:{local(s)}", str(label), str(defn)))

          # Get ontology metadata
          ont_title = ""
          ont_desc  = ""
          ont_creator = ""
          ont_version = ""
          for s in g.subjects(RDF.type, OWL.Ontology):
              ont_title   = str(g.value(s, DCTERMS.title) or "VsML")
              ont_desc    = str(g.value(s, DCTERMS.description) or "")
              ont_creator = str(g.value(s, DCTERMS.creator) or "")
              ont_version = str(g.value(s, OWL.versionInfo) or "")

          def rows(items):
              if not items:
                  return "<tr><td colspan='3' style='color:#888;font-style:italic'>None defined yet</td></tr>"
              return "\n".join(
                  f"<tr><td><code>{term}</code></td><td>{lbl}</td><td>{dfn}</td></tr>"
                  for term, lbl, dfn in sorted(items)
              )

          html = f"""<!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8"/>
            <meta name="viewport" content="width=device-width,initial-scale=1"/>
            <title>{ont_title}</title>
            <style>
              body{{font-family:system-ui,sans-serif;max-width:860px;margin:60px auto;padding:0 20px;color:#1a1a18;line-height:1.7}}
              h1{{font-size:28px;font-weight:600;margin-bottom:4px}}
              .subtitle{{font-size:16px;color:#5f5e5a;margin-bottom:0}}
              h2{{font-size:18px;font-weight:500;margin-top:40px;border-bottom:1px solid #e5e5e3;padding-bottom:8px}}
              .meta{{display:flex;gap:20px;margin:16px 0;font-size:13px;color:#888}}
              .ns{{font-family:monospace;background:#f5f5f3;padding:10px 16px;border-radius:8px;font-size:15px}}
              table{{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}}
              th{{text-align:left;font-size:13px;color:#666;padding:8px 12px;border-bottom:1px solid #e5e5e3;font-weight:500}}
              td{{padding:8px 12px;border-bottom:1px solid #f0f0ee;vertical-align:top}}
              code{{font-size:12px;background:#f5f5f3;padding:1px 5px;border-radius:4px}}
              a{{color:#185fa5;text-decoration:none}}
              a:hover{{text-decoration:underline}}
              .badge{{display:inline-block;padding:2px 8px;border-radius:12px;font-size:12px;font-weight:500;margin-right:6px}}
              .ocx{{background:#e6f1fb;color:#0c447c}}
              .sfi{{background:#faeeda;color:#633806}}
              .grn{{background:#e1f5ee;color:#085041}}
              .downloads{{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}}
              .dl-btn{{padding:8px 16px;border:1px solid #e5e5e3;border-radius:8px;font-size:13px;color:#1a1a18;background:#fff}}
              .dl-btn:hover{{background:#f5f5f3}}
              footer{{margin-top:60px;font-size:13px;color:#888;border-top:1px solid #e5e5e3;padding-top:20px}}
            </style>
          </head>
          <body>

            <h1>VsML</h1>
            <p class="subtitle">{ont_desc}</p>
            <div class="meta">
              <span>Version {ont_version}</span>
              <span>·</span>
              <span>Updated {date.today().isoformat()}</span>
              <span>·</span>
              <span>Author: {ont_creator}</span>
              <span>·</span>
              <span><a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a></span>
            </div>

            <h2>Namespace</h2>
            <div class="ns">https://vsml.no/</div>

            <h2>Download</h2>
            <div class="downloads">
              <a class="dl-btn" href="ontology/vsml.ttl">Turtle (.ttl)</a>
              <a class="dl-btn" href="ontology/vsml.owl">RDF/XML (.owl)</a>
              <a class="dl-btn" href="ontology/vsml.jsonld">JSON-LD (.jsonld)</a>
            </div>

            <h2>Classes ({len(classes)})</h2>
            <table>
              <tr><th>Term</th><th>Label</th><th>Definition</th></tr>
              {rows(classes)}
            </table>

            <h2>Object properties ({len(properties)})</h2>
            <table>
              <tr><th>Term</th><th>Label</th><th>Definition</th></tr>
              {rows(properties)}
            </table>

            <h2>Named individuals ({len(individuals)})</h2>
            <table>
              <tr><th>Term</th><th>Label</th><th>Definition</th></tr>
              {rows(individuals)}
            </table>

            <h2>Federated ontologies</h2>
            <p>VsML is designed to federate across:</p>
            <ul>
              <li><span class="badge ocx">OCX</span> <a href="https://3docx.org">OCX Schema</a> — structural and dimensional vessel data</li>
              <li><span class="badge sfi">SFI</span> <a href="https://www.dnv.com/sfi/">SFI Index System</a> — ship systems reference designators</li>
              <li><span class="badge grn">ORG</span> <a href="https://www.w3.org/TR/vocab-org/">W3C Organization Ontology</a> — organizational concepts</li>
              <li><span class="badge grn">PROV</span> <a href="https://www.w3.org/TR/prov-o/">PROV-O</a> — provenance and documentation</li>
              <li><span class="badge grn">OM</span> <a href="http://www.ontology-of-units-of-measure.org">Ontology of Units of Measure</a> — measurements and units</li>
            </ul>

            <h2>Instance data</h2>
            <p>
              <a href="instances/gunnerus.ttl">gunnerus.ttl</a> — RDF instance data
              for the research vessel Gunnerus, operated by
              <a href="https://www.ntnu.edu/">NTNU</a>.
            </p>

            <h2>Source</h2>
            <p>
              <a href="https://github.com/Jan-Altea/vsml-ontology">
                github.com/Jan-Altea/vsml-ontology
              </a>
            </p>

            <footer>
              VsML is developed at NTNU — Norwegian University of Science and Technology.
              Licensed under <a href="https://mit-license.org/">MIT License</a>.
              <br/>
              Auto-generated from <code>vsml.ttl</code> on {date.today().isoformat()}.
            </footer>

          </body>
          </html>"""

          import os
          os.makedirs("docs", exist_ok=True)
          with open("docs/index.html", "w") as f:
              f.write(html)
          print(f"✓ docs/index.html generated")
          print(f"  Classes: {len(classes)}")
          print(f"  Properties: {len(properties)}")
          print(f"  Individuals: {len(individuals)}")
          EOF

      # 9. Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs
          publish_branch: gh-pages
          exclude_assets: '.github'
